
name: Deploy to GitHub Pages

on:
  workflow_dispatch:
  release:
    types: [published]

# Required permissions for GitHub Pages deployment
permissions:
  contents: read
  pages: write
  id-token: write

# Prevent duplicate builds
concurrency:
  group: "pages"
  cancel-in-progress: false

env:
  # Name of the binary in Cargo.toml, and of the files wasm-bindgen writes.
  GAME: cat-soccer
  CARGO_TERM_COLOR: always

jobs:
  # --- 1. Build WebAssembly game ---
  build:
  # Build and optimize a WebAssembly release (GitHub Pages)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      # Pin to the same Rust as local builds (Bevy 0.20 needs 1.97.1 or newer).
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.97.1
          targets: wasm32-unknown-unknown

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2

      # The wasm-bindgen CLI must be exactly the version in Cargo.lock, or packaging fails.
      - name: Read wasm-bindgen version from Cargo.lock
        id: bindgen
        run: |
          version=$(grep -A1 '^name = "wasm-bindgen"$' Cargo.lock | sed -n 's/^version = "\(.*\)"$/\1/p')
          echo "version=$version" >> "$GITHUB_OUTPUT"

      # Seconds vs. minutes for wasm-bindgen: https://github.com/jetli/wasm-bindgen-action
      - uses: jetli/wasm-bindgen-action@v0.2.0
        with:
          version: ${{ steps.bindgen.outputs.version }}

      - name: Install binaryren (for wasm-opt)
        run: |
          curl -sSL https://github.com/WebAssembly/binaryen/releases/download/version_123/binaryen-version_123-x86_64-linux.tar.gz | tar xz
          echo "$PWD/binaryen-version_123/bin" >> "$GITHUB_PATH"

      - name: Build WebAssembly release
        run: cargo build --profile web-release --target wasm32-unknown-unknown

      - name: Package with wasm-bindgen & wasm-opt
        run: |
          mkdir dist
          wasm-bindgen --out-dir dist --out-name "$GAME" --target web --no-typescript \
            "target/wasm32-unknown-unknown/web-release/$GAME.wasm"
          wasm-opt -Oz --all-features -o "dist/${GAME}_bg.wasm" "dist/${GAME}_bg.wasm"
          cp wasm/index.html dist/
          cp -r assets dist/

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  # --- 2. Publish to GitHub pages ---
  deploy:
    if: github.ref == 'refs/heads/main' || github.event_name == 'release'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4