<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
  <!-- Relative paths: GitHub Pages serves the game under /<repo>/, not the site root. -->
  <link rel="icon" type="image/png" href="assets/ui/catstick.png" />
  <title>Cat soccer</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #111;
      color: #ccc;
      font-family: system-ui, sans-serif;
    }
    /* Bevy sizes the canvas to fill this box (fit_canvas_to_parent). */
    #game {
      position: fixed;
      inset: 0;
    }
    canvas {
      display: block;
      outline: none;
      touch-action: none;
      user-select: none;
      -webkit-user-select: none;
    }
    #status {
      position: fixed;
      inset: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      text-align: center;
      padding: 16px;
      pointer-events: none;
    }
  </style>
</head>
<body oncontextmenu="return false;">
  <div id="game"><canvas id="bevy" tabindex="0"></canvas></div>
  <div id="status">Loading…</div>

  <script>
    // Browsers keep audio muted until the player clicks, taps or presses a key. Bevy creates its
    // AudioContext at startup, before that happens, so remember every context and resume them on
    // the first gesture. This must run before the game's script creates its context.
    (function () {
      const Original = window.AudioContext || window.webkitAudioContext;
      if (!Original) return;
      const contexts = [];
      const Tracked = new Proxy(Original, {
        construct(target, args) {
          const context = new target(...args);
          contexts.push(context);
          return context;
        },
      });
      window.AudioContext = Tracked;
      window.webkitAudioContext = Tracked;

      const gestures = ["pointerdown", "touchend", "keydown"];
      function resumeAll() {
        let allRunning = true;
        for (const context of contexts) {
          if (context.state !== "running") {
            allRunning = false;
            context.resume();
          }
        }
        // Keep listening until a context exists and is playing.
        if (contexts.length > 0 && allRunning) {
          gestures.forEach((name) => document.removeEventListener(name, resumeAll, true));
        }
      }
      gestures.forEach((name) => document.addEventListener(name, resumeAll, true));
    })();
  </script>

  <script type="module">
    import init from "./cat-soccer.js";

    const status = document.getElementById("status");
    const canvas = document.getElementById("bevy");

    // Bevy resizes the canvas once its window exists: that's when loading is over.
    new MutationObserver((_, observer) => {
      status.remove();
      observer.disconnect();
    }).observe(canvas, { attributes: true, attributeFilter: ["width", "height"] });

    init().catch((error) => {
      // winit can end its event loop by throwing this; it isn't a failure.
      if (error.message?.includes("Using exceptions for control flow")) return;
      console.error("Failed to start the game:", error);
      status.textContent = "Sorry, the game couldn't start in this browser. It needs WebGL2.";
    });
  </script>
</body>
</html>
